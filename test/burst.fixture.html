<!doctype html><html><head><meta charset="utf-8"><title>xrf fixture</title><link rel="stylesheet" href="/content.css">
<style>body{font:15px/1.4 -apple-system,system-ui,sans-serif;max-width:600px;margin:20px auto;background:#000;color:#e7e9ea}article{padding:12px 16px;border-bottom:1px solid #2f3336}article b{color:#fff}small{color:#71767b}</style></head>
<body>
<script>
// Mock chrome API + canned jev verdicts, so the content script runs outside the extension.
const CANNED = { "102": { cat: "slop", p: 0.91 }, "103": { cat: "spam", p: 0.97 }, "104": { cat: "offtopic", p: 0.88 }, "101": null, "105": null };
const mem = JSON.parse(sessionStorage.getItem('xrf-mem') || '{}'); window.__mem = mem;
const persist = () => sessionStorage.setItem('xrf-mem', JSON.stringify(mem));
window.__calls = JSON.parse(sessionStorage.getItem('xrf-calls') || '[]');
const logCall = n => { window.__calls.push(n); sessionStorage.setItem('xrf-calls', JSON.stringify(window.__calls)); }; window.__sync = { customKeywords: ['sourdough'], blockedHandles: [] };
window.__xrfMsgs = [];
window.chrome = {
  storage: { local: { get: async keys => { const defaults = (keys && typeof keys === 'object' && !Array.isArray(keys)) ? keys : {}; const list = keys == null ? Object.keys(mem) : typeof keys === 'string' ? [keys] : Array.isArray(keys) ? keys : Object.keys(keys);
               return Object.fromEntries(list.filter(k => k in mem || k in defaults).map(k => [k, k in mem ? mem[k] : defaults[k]])); }, set: async o => { Object.assign(mem, o); persist(); }, remove: async ks => { (Array.isArray(ks)?ks:[ks]).forEach(k => delete mem[k]); persist(); } },
             sync: { get: async d => ({ ...d, ...window.__sync }), set: async o => Object.assign(window.__sync, o) }, onChanged: { addListener() {} } },
  runtime: { id: "fixture", getManifest: () => ({ version: "fixture" }), onMessage: { addListener: fn => { window.__xrfOnMessage = fn; } },
    sendMessage: async msg => { window.__xrfMsgs.push(msg); if (msg.type !== "classify") return { ok: true };
      logCall(msg.replies.length);
      window.__xrfLastMsg = msg; return { mode: "proxy", verdicts: msg.replies.map(r => CANNED[r.id] ?? null) }; } },
};
history.replaceState({}, "", "/thsottiaux/status/100" + location.search);
// ?newids=1 keeps every reply's text but renumbers the status links, simulating X handing us
// different ids for the same replies. With content-hash caching this must cost zero jev calls.
window.__renumber = () => document.querySelectorAll('a[href*="/status/"]').forEach(a =>
  a.setAttribute("href", a.getAttribute("href").replace(/(\d+)$/, m => String(Number(m) + 9000))));
</script>
<div id="timeline">
<article data-testid="tweet"><div data-testid="User-Name"><a href="/thsottiaux"><b>Tibo</b></a></div><a href="/thsottiaux/status/100"><small>2h</small></a><div data-testid="tweetText">Update on rate limits in Codex.</div></article>
</div></article>
</div>
<script>if (location.search.includes("newids")) window.__renumber();</script>
<script>["/rules.js","/content.js"].forEach(u=>document.write(`<script src="${u}?t=${Date.now()}"><\/script>`));</script>
<script>
// ?invalidate=1 simulates the extension being reloaded while this tab stays open.
if (location.search.includes('invalidate')) setTimeout(() => { delete chrome.runtime.id; const boom = () => { throw new Error('Extension context invalidated.'); };
  chrome.storage.local.get = boom; chrome.storage.local.set = boom; chrome.runtime.sendMessage = boom; }, 1000);
window.addEventListener('unhandledrejection', e => { (window.__unhandled ||= []).push(String(e.reason)); });
window.addEventListener('error', e => { (window.__unhandled ||= []).push(String(e.message)); });

</script><script>
// Replies stream in the way X loads them while scrolling: 2 every 300ms, 40 total.
let __n = 0;
const __t = setInterval(() => {
  for (let k = 0; k < 2 && __n < 40; k++, __n++) {
    const a = document.createElement("article");
    a.setAttribute("data-testid", "tweet");
    a.innerHTML = `<div data-testid="User-Name"><a href="/user${__n}"><b>U${__n}</b></a></div>` +
      `<a href="/user${__n}/status/${5000 + __n}"><small>1h</small></a>` +
      `<div data-testid="tweetText">Reply number ${__n} with some substantive content about rate limits.</div>`;
    document.getElementById("timeline").appendChild(a);
  }
  if (__n >= 40) clearInterval(__t);
}, 300);
</script>
</body></html>
